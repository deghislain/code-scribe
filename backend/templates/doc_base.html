<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ title }}</title>
  <style>
    @page {
      size: A4;
      margin: 2cm 2.2cm 2.5cm 2.2cm;
      @top-center {
        content: "{{ title }}";
        font-size: 9pt;
        color: #888;
      }
      @bottom-center {
        content: "Page " counter(page) " of " counter(pages);
        font-size: 9pt;
        color: #888;
      }
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 11pt;
      line-height: 1.65;
      color: #1a1a1a;
      background: #fff;
    }

    h1 {
      font-size: 22pt;
      font-weight: 700;
      margin-top: 0;
      color: #1a1a2e;
      border-bottom: 2px solid #3b82d4;
      padding-bottom: 0.3em;
    }

    h2 {
      font-size: 15pt;
      font-weight: 600;
      color: #1a1a2e;
      margin-top: 1.6em;
      margin-bottom: 0.4em;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.2em;
    }

    h3 {
      font-size: 12pt;
      font-weight: 600;
      color: #333;
      margin-top: 1.2em;
    }

    p {
      margin: 0.5em 0;
    }

    ul, ol {
      margin: 0.5em 0 0.5em 1.5em;
    }

    li {
      margin-bottom: 0.3em;
    }

    code {
      font-family: "Courier New", Courier, monospace;
      font-size: 9.5pt;
      background: #f3f4f6;
      padding: 0.1em 0.3em;
      border-radius: 3px;
    }

    pre {
      font-family: "Courier New", Courier, monospace;
      font-size: 9pt;
      background: #f3f4f6;
      padding: 0.8em 1em;
      border-left: 3px solid #3b82d4;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    pre code {
      background: none;
      padding: 0;
    }

    section {
      margin-bottom: 1.2em;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.8em 0;
      font-size: 10pt;
    }

    th, td {
      border: 1px solid #d1d5db;
      padding: 0.4em 0.7em;
      text-align: left;
    }

    th {
      background: #f0f4ff;
      font-weight: 600;
    }

    dl dt {
      font-weight: 600;
      margin-top: 0.7em;
    }

    dl dd {
      margin-left: 1.5em;
    }

    .cover {
      page-break-after: always;
      text-align: center;
      padding-top: 5cm;
    }

    .cover h1 {
      font-size: 28pt;
      border: none;
    }

    .cover .meta {
      color: #555;
      margin-top: 1cm;
      font-size: 10pt;
      line-height: 1.8;
    }

    .cover .meta .version-badge {
      display: inline-block;
      margin-top: 0.4cm;
      padding: 0.2em 0.8em;
      background: #f0f4ff;
      border: 1px solid #c7d7f9;
      border-radius: 4px;
      font-size: 9pt;
      color: #1d4ed8;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="cover">
    <h1>{{ title }}</h1>
    <div class="meta">
      Generated by Code-Scribe<br/>
      <strong>{{ generated_at }}</strong><br/>
      <span class="version-badge">Version {{ version }}</span>
    </div>
  </div>
  {{ content | safe }}
</body>
</html>
